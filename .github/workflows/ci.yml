name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # AGENTS.md must stay a symlink to CLAUDE.md so the two agents cannot
      # drift apart onto different rules.
      - name: AGENTS.md is a symlink to CLAUDE.md
        run: |
          test -L AGENTS.md || { echo "AGENTS.md must be a symlink"; exit 1; }
          test "$(readlink AGENTS.md)" = "CLAUDE.md" || { echo "wrong target"; exit 1; }

      # apps/*/AGENTS.md is GENERATED by `next dev`, which rewrites it on every
      # run, and its text is Next.js's rather than Beco's. Excluded explicitly
      # rather than by weakening the rule: the rule protects Beco's voice, and
      # policing a vendor file only produces a dirty tree nobody can clean.
      # This had been failing since 1bd7405.
      - name: No em dashes in source or docs
        run: |
          if grep -rl "—" --include="*.ts" --include="*.tsx" --include="*.sql" \
               --include="*.md" --include="*.css" . \
               | grep -v node_modules | grep -v "^./prototype/" | grep -v "^./files/" \
               | grep -vE "(^\./)?apps/[^/]+/AGENTS\.md$"; then
            echo "Em dash found. Use a comma, a period, or a colon."
            exit 1
          fi

      - name: No browser dialogs
        run: |
          if grep -rnE "window\.(confirm|alert|prompt)\(|(^|[^.\w])(confirm|alert|prompt)\(" \
               --include="*.ts" --include="*.tsx" apps packages tools \
               | grep -v node_modules | grep -v "confirm-dialog" | grep -v "onConfirm"; then
            echo "Browser dialog found. Use ConfirmDialog or toast() from @beco/ui."
            echo "See CLAUDE.md rule 4."
            exit 1
          fi

      - run: pnpm check:secrets
      - run: pnpm check:type-floor
      - run: pnpm typecheck
      - run: pnpm --filter @beco/ui check:contrast

      # The jsdom suites: pure functions, the design system, the storefront
      # and the dashboard. No database needed for these.
      - run: pnpm test:unit
      - run: pnpm test:component
      - run: pnpm test:dashboard

      # Everything that needs Postgres, against a LOCAL ephemeral database.
      # Nothing in CI ever connects to staging or production. Left running
      # past the integration tests now: the build below does real,
      # server side data fetching at build time for every statically
      # generated product and category page, and stopping Supabase before
      # that build step, which this job used to do right here, made every
      # one of those pages fail with "supabaseUrl is required" since there
      # was nothing listening at that URL by the time the build asked for
      # it. Stopped at the very end instead, once nothing else needs it.
      - uses: supabase/setup-cli@v1
      - name: Start Supabase and export its local URL and anon key
        run: |
          supabase start
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"

      - name: Database-backed tests, local only
        run: |
          supabase test db
          pnpm test:integration

      - run: pnpm build

      # A page that renders but logs a console error is not a passing page.
      # This is how the CSP eval bug reached a browser rather than CI.
      - name: Storefront serves cleanly with no console errors
        run: |
          pnpm --filter @beco/storefront start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/design-system)
          test "$code" = "200" || { echo "design-system returned $code"; exit 1; }
          csp=$(curl -sD- -o /dev/null http://localhost:3000/ | grep -i content-security-policy)
          echo "$csp" | grep -q "unsafe-eval" && { echo "unsafe-eval in production CSP"; exit 1; }
          echo "$csp" | grep -q "upgrade-insecure-requests" || { echo "missing upgrade-insecure-requests"; exit 1; }
          echo "production CSP correct"

      - if: always()
        run: supabase stop

  # Separate job: a production build measured with the motion live, per
  # CLAUDE.md's performance budgets. The catalogue is seeded but has no
  # images in CI, so lighthouserc.json hard-fails on CLS and blocking time
  # and warns on the image-dominated metrics. See docs/milestones/M4-TODO.md.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
      - name: Seed a local catalogue for the run
        run: |
          supabase start
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"

      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm lighthouse
      - if: always()
        run: supabase stop

